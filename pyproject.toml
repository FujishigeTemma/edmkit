[project]
name = "edmkit"
version = "0.0.16"
description = "Simple EDM (Empirical Dynamic Modeling) library"
authors = [{ name = "FUJISHIGE TEMMA", email = "tenma.x0@gmail.com" }]
readme = "README.md"
requires-python = ">= 3.13"
dependencies = [
    "kdtree-rs>=0.3.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "tinygrad>=0.14.0",
    "tinysolve>=0.2.2",
]

[dependency-groups]
benchmark = [
    "pandas>=3.1.0",
    "pyedm>=2.5.7",
]
dev = [
    "griffe2md>=1.5.1",
    "hypothesis>=6.170.14",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pywavelets>=1.10.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
filterwarnings = ["error"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring tinygrad tensor backend (deselect with '-m \"not gpu\"')",
    "dense: marks benchmarks that build an (M, N) matrix",
    "huge: marks benchmarks whose N is too large for an (M, N) matrix in memory (deselect with '-m \"not (dense and huge)\"')",
]


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "edmkit"
namespace = true
